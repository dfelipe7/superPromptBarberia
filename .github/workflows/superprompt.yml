name: Superprompt Validation & Build

on:
  push:
    branches: [ master, main ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'build.py'
  pull_request:
    branches: [ master, main ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'build.py'
  workflow_dispatch:

jobs:
  build-superprompt:
    name: Compile and Validate Modular Superprompts
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ejecutar Compilador de Superprompt
        run: python build.py

      - name: Validar existencia de los Superprompts
        run: |
          test -f SUPERPROMPT.md || exit 1
          test -f backend/SUPERPROMPT_BACKEND.md || exit 1
          test -f frontend/SUPERPROMPT_FRONTEND.md || exit 1
          echo "SUPERPROMPT Maestro, Backend y Frontend compilados y validados exitosamente en GitHub Actions."
